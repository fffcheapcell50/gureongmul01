<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>구간 그물</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위쪽에 영상과 타임라인, 아래(넓은 화면은 오른쪽)에 연습 범위·구간 편집·구간 목록·북마크 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#121c26; --muted:#5b6a79; --line:#d2d9e0;
  --accent:#2352e6; --accent-ink:#ffffff; --accent-soft:rgba(35,82,230,.14);
  --mark:#d9500b; --out:#e3e8ed; --danger:#c42b2b; --good:#0f8a5f;
  --c1:#d64545; --c2:#d9a400; --c3:#1f9d63; --pull:#8e44ff;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#162029; --ink:#e6edf3; --muted:#8fa1b2; --line:#27343f;
    --accent:#6c93ff; --accent-ink:#0b1220; --accent-soft:rgba(108,147,255,.22);
    --mark:#ff8a4c; --out:#1c2832; --danger:#ff7b7b; --good:#46d19b;
    --c1:#ff7a7a; --c2:#ffd166; --c3:#46d19b; --pull:#c59bff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#162029; --ink:#e6edf3; --muted:#8fa1b2; --line:#27343f;
  --accent:#6c93ff; --accent-ink:#0b1220; --accent-soft:rgba(108,147,255,.22);
  --mark:#ff8a4c; --out:#1c2832; --danger:#ff7b7b; --good:#46d19b;
  --c1:#ff7a7a; --c2:#ffd166; --c3:#46d19b; --pull:#c59bff; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs,15px);line-height:1.5;
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.hbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.hbar .btn{padding:6px 14px}
.urlbar.pop{position:fixed;z-index:40;margin:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.urlbar[hidden]{display:none}
.recent{flex:1 1 100%;display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;margin-top:2px}
.recent .rh{font-size:11px;color:var(--muted)}
.recent .ri{display:flex;align-items:stretch;gap:4px}
.recent .rb{flex:1;min-width:0;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.recent .rb b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rb small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rx{width:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer}
h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.urlbar{gap:8px;flex-wrap:wrap}
.urlbar input[type=text]{flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:var(--rb,6px);min-height:var(--btnh,38px);line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.mark{background:var(--mark);color:#fff;border-color:var(--mark);font-weight:700;font-size:17px;min-height:52px;flex:1 1 160px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;min-height:var(--btnsm,32px);font-size:13px}
.grid{display:grid;gap:var(--gap,16px);grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){
  .grid{grid-template-columns:minmax(0,var(--lf,1.1fr)) minmax(0,1fr);align-items:start}
  .stage{position:sticky;top:16px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,8px);padding:14px}
.stack{display:flex;flex-direction:column;gap:var(--gap,16px);min-width:0}
.player-wrap{position:relative;aspect-ratio:16/9;width:var(--vw,100%);max-width:100%;background:#000;border-radius:6px;overflow:hidden}
.player-wrap iframe,#player,#lv{position:absolute;inset:0;width:100%;height:100%}
#lv{background:#000}
.player-wrap.flip #player,.player-wrap.flip #lv{transform:scaleX(-1)}
.pipov,.pipx,.piprz{display:none}
.player-wrap.pip{position:fixed;z-index:25;max-width:none;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.player-wrap.pip .pipov{display:block;position:absolute;inset:0;z-index:3;touch-action:none;cursor:move}
.player-wrap.pip .pipx{display:flex;position:absolute;top:4px;right:4px;z-index:4;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;align-items:center;justify-content:center;cursor:pointer;padding:0}
.player-wrap.pip .piprz{display:block;position:absolute;left:0;bottom:0;z-index:4;width:22px;height:22px;cursor:nesw-resize;touch-action:none;background:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.75) 50%) no-repeat;background-size:100% 100%;clip-path:polygon(0 0,0 100%,100% 100%);opacity:.8}
.msg{color:var(--danger);font-size:13px;margin-top:8px;min-height:0}
.clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.clock .big{font-size:28px;font-weight:500}
.clock .sub{color:var(--muted);font-size:13px}
.rates{display:flex;gap:3px;margin-left:auto;flex-wrap:nowrap;justify-content:flex-end;min-width:0;max-width:100%}
.rates .btn{flex:0 1 auto;min-width:0;padding:0 5px;font-size:11px;white-space:nowrap}
@media (max-width:520px){.clock .rates{flex:1 1 100%;gap:2px}.rates .btn{flex:1 1 0;padding:0 1px;font-size:10px}}
@media (min-width:521px){.clock .rates{flex:1 1 100%;gap:4px}.rates .btn{flex:1 1 0;padding:0 2px;font-size:12px}}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tl{position:relative;height:var(--tlh,56px);background:var(--out);border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tl.selmode{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:-2px}
.seg{position:absolute;top:0;bottom:0;display:block}
.seg.in{background:var(--accent-soft)}
.seg.in.alt{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.seg.out{background:transparent}
.seg.hid{background:repeating-linear-gradient(135deg,#000 0 6px,#1d262e 6px 12px)!important}
.seg.dim{opacity:.3}
.seg.sel{outline:2px solid var(--ink);outline-offset:-2px}
.seg.ms{background:color-mix(in srgb,var(--good) 40%,transparent)!important;outline:2px solid var(--good);outline-offset:-2px}
.seg .cs{position:absolute;left:0;right:0;top:0;height:7px}
.cs.c1{background:var(--c1)} .cs.c2{background:var(--c2)} .cs.c3{background:var(--c3)}
.lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;line-height:1.1;font-family:var(--font-mono)}
.lab b{font-size:14px;font-weight:700}
.lab em{font-style:normal;font-size:11px;color:var(--accent)}
.seg.out .lab{opacity:.5}
.ln{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--mark);pointer-events:none}
.ln.sel{width:6px;margin-left:-3px;background:var(--mark);box-shadow:0 0 0 2px var(--surface),0 0 8px var(--mark);z-index:2}
.ln.pl{width:4px;margin-left:-2px;background:var(--pull)}
.tl.panmode{outline:2px solid var(--accent);cursor:grabbing}
#zmwrap{display:inline-flex;align-items:center;gap:4px}
#zmwrap[hidden]{display:none}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:0;pointer-events:none;z-index:3}
.box{position:absolute;top:0;bottom:0;pointer-events:none;z-index:4}
.box.win{background:rgba(35,82,230,.25);border:2px solid var(--accent)}
.box.cross{background:rgba(15,138,95,.25);border:2px dashed var(--good)}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.transport{display:flex;gap:5px;flex-wrap:nowrap;margin-top:8px}
.transport.tpmain{margin-top:18px}
.transport .btn{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px;white-space:nowrap;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{margin-top:10px;font-size:14px;min-height:22px}
.adj{display:flex;flex-direction:column;gap:4px;margin:4px 0 2px}
.adjrow{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.adjrow .lbl{flex:0 0 auto;width:26px;font-size:13px;white-space:nowrap}
.adjrow .tv{flex:0 0 auto;width:58px;font-size:13px;white-space:nowrap}
.adjrow .btn{flex:1 1 0;min-width:0;padding:5px 0;font-size:11.5px;white-space:nowrap;text-align:center}
.edtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:2px 0 4px}
.edtop .ttl{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edtop .field{flex:0 0 auto;flex-wrap:nowrap;white-space:nowrap;font-size:12.5px;cursor:pointer;margin:0}
#selwrap{margin-bottom:2px}
#selwrap[hidden]{display:none}
.lnbox{border:1px solid var(--mark);border-radius:6px;padding:10px;margin-bottom:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);user-select:none;-webkit-user-select:none}
.item.cc1{border-left:5px solid var(--c1)} .item.cc2{border-left:5px solid var(--c2)} .item.cc3{border-left:5px solid var(--c3)}
.item.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.item.now{background:var(--accent-soft)}
.item.out{opacity:.55}
.item.dragging{opacity:.45;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.item .pos{font-weight:700;font-size:15px;text-align:center;border:0;background:transparent;padding:3px 0;cursor:grab}
.item .meta{font-size:12px;color:var(--muted);min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.item .meta .memo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .meta .nm{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.item .meta .no{color:var(--accent);font-size:12px}
.item .nmin{flex:1;min-width:70px;padding:2px 6px;font-size:12px;height:24px}
.item .memoin{flex:1;min-width:70px;padding:2px 6px;font-size:12px;height:24px}
.ltools{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 8px}
.ltools .btn{min-height:30px;height:30px;padding:0 7px;font-size:12.5px}
.item .meta b{color:var(--ink);font-size:13px;font-weight:500}
.item .memo{color:var(--ink);font-size:12px}
.item .xtra{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px;cursor:default;user-select:text;-webkit-user-select:text}
.item .xtra input[type=text]{width:100%}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);vertical-align:middle}
.dot.c1{background:var(--c1);border-color:var(--c1)} .dot.c2{background:var(--c2);border-color:var(--c2)} .dot.c3{background:var(--c3);border-color:var(--c3)}
.divider{font-size:12px;color:var(--mark);border-top:2px dashed var(--mark);padding-top:4px;margin-top:4px}
.dropline{height:4px;border-radius:2px;background:var(--accent);margin:0}
.bm{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.bm .name{flex:1;min-width:0;overflow-wrap:anywhere}
.bm .name small{display:block;color:var(--muted);font-size:12px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;font-family:var(--font-mono);font-size:12px}
input[type=text],input[type=number]{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.keys{font-size:12px;color:var(--muted);line-height:1.7}
kbd{font-family:var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 접고 펼치기 */
.fold{touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:10px;width:calc(100% + 28px);background:var(--bg);border:0;border-bottom:1px solid var(--line);border-radius:calc(var(--r,8px) - 1px) calc(var(--r,8px) - 1px) 0 0;padding:10px 14px;margin:-14px -14px 12px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:left}
.fold:hover{color:var(--ink);background:var(--accent-soft)}
.fold>span{flex:1;min-width:0}
.chev{display:inline-block;flex:none;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid currentColor;transition:transform .15s}
.card:not(.folded) .chev{transform:rotate(180deg)}
.card.folded .fbody{display:none}
.card.folded .fold{margin-bottom:-14px;border-bottom:0;border-radius:calc(var(--r,8px) - 1px)}
/* 카드 자유 배치 */
.grid.free{display:block;position:relative}
.grid.free .stack{display:contents}
.grid.free .card{position:absolute!important;margin:0}
.ctools{display:none;align-items:center;gap:10px;margin:0 0 10px;font-size:12px;color:var(--muted)}
html.tuning .ctools{display:flex}
.transport .qm{align-self:center}
.qm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;margin-left:6px;cursor:help;flex:none;letter-spacing:0;user-select:none;-webkit-user-select:none}
[data-tip]{-webkit-touch-callout:none}
#tipbox{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 24px));background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:6px;font-size:12.5px;font-weight:400;letter-spacing:0;line-height:1.55;pointer-events:none;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:left}
.cfb{padding-left:10px;padding-right:10px}
.cutbox{margin:10px 0 4px}
.editbar{margin:6px 0 8px}
.syncst{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 6px}
.syncst.err{color:#ff7a7a}
.syncbox{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.subfold{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:4px 6px 4px 0;-webkit-tap-highlight-color:transparent}
.subfold b{font-size:11px;width:14px;text-align:center}
#editwrap[hidden]{display:none}
.emptylist{padding:14px 4px;color:var(--muted);font-size:13px;list-style:none}
.cutbox .hint{margin:6px 0 0}
.cutbox .row2{display:flex;flex-wrap:nowrap;align-items:center;gap:5px}
.cutbox .row2 .btn.sm{padding:4px 7px;font-size:12.5px;white-space:nowrap;flex:0 1 auto;min-width:0}
.cutbox .row2 .field{flex-wrap:nowrap;gap:4px;white-space:nowrap;font-size:12px;flex:0 0 auto}
.cutbox .row2 .field input{width:44px!important;padding:4px 4px}
[data-fold]{position:relative}
.linkbox{position:absolute;top:0;right:12px;height:41px;display:none;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;z-index:1}
html.tuning .linkbox{display:inline-flex}
html.tuning [data-fold] .fold{padding-right:86px}
html.tuning.freeon .fold{cursor:grab;touch-action:none}
.ctools .grip{flex:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1px dashed var(--line);border-radius:6px;padding:5px 8px;text-align:center}
html:not(.freeon) .ctools .grip{display:none}
.ctools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.card.linked{box-shadow:inset 3px 0 0 var(--accent)}
.card.dragging{z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:.96}
.card.dragging .grip{cursor:grabbing}
.card.snapto{outline:2px solid var(--accent);outline-offset:-2px}
/* UI 조절 패널 (임시) */
.undofix{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:12px;z-index:30;display:flex;gap:8px}
.undofix .round{width:60px;height:40px;min-height:40px;padding:0;border-radius:20px;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.undofix .round:disabled{opacity:.35;box-shadow:none}
.tunebtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tune{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:30;width:min(340px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.tune.min{width:auto;padding:8px 10px;overflow:visible}
.tune.min>:not(.thead){display:none}
.tune.min .thead{margin-bottom:0!important;gap:10px}
.tune .tr{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.tune .tr input[type=range]{width:100%;min-width:0}
.tune .tr output{font-family:var(--font-mono);font-size:12px;text-align:right}
.tune input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hbar"><h1>구간 그물</h1><button class="btn primary" id="linkbtn" type="button">링크</button><button class="syncst" id="syncst" type="button" hidden data-tip="눌러서 지금 동기화합니다."></button></div>
  <form class="urlbar pop" id="urlform" hidden>
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="유튜브 링크 또는 영상 ID">
    <button class="btn primary" type="submit">불러오기</button>
    <label class="btn" for="file" style="display:inline-flex;align-items:center">내 영상 파일 열기</label>

function customView(){return !!(dur&&S&&prefs.sort==='custom'&&S.order.length)}
var prefs=LS.get('looper:v1:prefs')||{};
if(['orig','custom','both'].indexOf(prefs.barNum)<0)prefs.barNum='orig';
if(['custom','orig'].indexOf(prefs.sort)<0)prefs.sort='orig';
if(prefs.sortv!==2){prefs.sort='orig';prefs.sortv=2}
if(!Array.isArray(prefs.cfs))prefs.cfs=(prefs.cf>0&&prefs.cf<=3)?[prefs.cf]:[];
prefs.cfs=prefs.cfs.filter(function(c){return c>=0&&c<=3});
delete prefs.cf;
prefs.rev=!!prefs.rev;
if(![0,5,10,15,20].includes(prefs.lrows))prefs.lrows=10;
function cfActive(){return prefs.cfs.length>0}
function cfOk(id){return !cfActive()||prefs.cfs.indexOf(colorOf(id))>=0}
if(typeof prefs.cfLoop!=='boolean')prefs.cfLoop=true;
if(!(prefs.thr>0))prefs.thr=3;
prefs.fold=!!prefs.fold;
if(!(prefs.pullN>0))prefs.pullN=2;
function savePrefs(){LS.set('looper:v1:prefs',prefs)}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(t){
  t=Math.max(0,t);var m=Math.floor(t/60),s=t-m*60,h=Math.floor(m/60);
  var ss=s.toFixed(1);if(ss.length<4)ss='0'+ss;
  return h?(h+':'+String(m%60).padStart(2,'0')+':'+ss):(m+':'+ss);
}
function toast(msg){
  var el=$('#toast');el.textContent=msg;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2600);
}
function newState(){return {secs:[{id:1,s:0}],nid:2,order:[1],n:0,nx:0,sm:0,sc:0,reps:1,rate:1,flip:false}}
function validState(x){
  return x&&Array.isArray(x.secs)&&x.secs.length&&Array.isArray(x.order)&&typeof x.nid==='number'
    &&x.order.length===x.secs.filter(function(g){return !g.h}).length;
}

/* 구간 계산 */
function ix(id){for(var i=0;i<S.secs.length;i++)if(S.secs[i].id===id)return i;return -1}
function st(id){return S.secs[ix(id)].s}
function en(id){var i=ix(id);return i<S.secs.length-1?S.secs[i+1].s:(dur||S.secs[i].s+1)}
function isHid(id){var i=ix(id);return i>=0&&!!S.secs[i].h}
function colorOf(id){var i=ix(id);return i<0?0:(S.secs[i].c||0)}
function onum(id){
  var c=0;
  for(var i=0;i<S.secs.length;i++){
    if(!S.secs[i].h)c++;
    if(S.secs[i].id===id)return S.secs[i].h?0:c;
  }
  return 0;
}
function visCount(){return S.order.length}
function rEnd(){return S.n||S.order.length}
function rangeList(){
  var l;
  if(S.sm>0)l=S.order.slice(0,S.sm);
  else if(prefs.rev){var ex=S.order.slice(rEnd());l=ex.slice(0,S.nx||ex.length)}
  else l=S.order.slice(0,rEnd());
  if(cfActive()&&prefs.cfLoop)l=l.filter(cfOk);
  return l;
}
function clampRange(){
  var n=S.order.length;
  if(S.n>=n)S.n=0;
  if(S.n<0)S.n=0;
  if(!(S.sm>0))S.sm=0;else if(S.sm>n)S.sm=n;
  if(!(S.sc>0))S.sc=0;else if(S.sc>n)S.sc=n;
  var ex=n-rEnd();
  if(!(S.nx>0)||S.nx>=ex)S.nx=0;
}
function segAt(t){
  for(var i=S.secs.length-1;i>=0;i--){if(S.secs[i].s<=t)return S.secs[i].id}
  return S.secs[0].id;
}

/* 막대 좌표: 숨김 접기를 켜면 숨긴 구간의 폭이 0이 된다 */
function buildMap(){
  spans=[];V=0;
  if(!dur||!S)return;
  if(customView()){
    var cx=0;
    S.order.forEach(function(id){var a=st(id),b=en(id);spans.push({a:a,b:b,x:cx,id:id});cx+=(b-a)});
    V=cx||dur;return;
  }
  zInfo=null;
  if(!prefs.fold&&prefs.zoom==='auto'){
    var cn=S.secs.length-1,L=30;
    if(cn>=3){
      var lens=[];for(var zi=0;zi<cn;zi++)lens.push(S.secs[zi+1].s-S.secs[zi].s);
      lens.sort(function(a,b){return a-b});
      var med=lens.length%2?lens[(lens.length-1)/2]:(lens[lens.length/2-1]+lens[lens.length/2])/2;
      L=med*(prefs.zmult||6);
    }
    L=Math.max(2,L);
    if(L<dur){
      var zc=zDet?zC:curTime(),ws=zc-L/2;
      if(ws<0)ws=0;
      var we=ws+L;if(we>dur){we=dur;ws=Math.max(0,dur-L)}
      zLastT=zc;zInfo={ws:ws,we:we,L:we-ws};
      spans=[{a:ws,b:we,x:0}];V=we-ws;return;
    }
  }
  if(!prefs.fold&&(prefs.zoom==='cuts'||prefs.zoom==='range')&&S.secs.length>1){
    var nS=S.secs.length,avg=(S.secs[nS-1].s-S.secs[0].s)/(nS-1)||1;
    var vend=function(id){var i=ix(id),e=en(id);return i===nS-1?Math.min(e,S.secs[i].s+avg):e};
    var za,zb;
    if(prefs.zoom==='range'){
      var rl=rangeList();
      if(rl.length){za=Infinity;zb=-Infinity;rl.forEach(function(id){za=Math.min(za,st(id));zb=Math.max(zb,vend(id))})}
    }
    if(za==null||!isFinite(za)){za=S.secs[0].s;zb=vend(S.secs[nS-1].id)}
    if(zb-za>0.5){spans=[{a:za,b:zb,x:0}];V=zb-za;return}
  }
  if(!prefs.fold){spans=[{a:0,b:dur,x:0}];V=dur;return}
  var x=0;
  S.secs.forEach(function(sg){
    if(sg.h)return;
    var a=sg.s,b=en(sg.id),last=spans[spans.length-1];
    if(last&&Math.abs(last.b-a)<1e-9){last.b=b}else{spans.push({a:a,b:b,x:x})}
    x+=(b-a);
  });
  if(!spans.length){spans=[{a:0,b:dur,x:0}];x=dur}
  V=x;
}
function t2f(t){
  if(!dur||!V||!spans.length)return 0;
  if(spans[0].id!=null){
    var cid=(typeof cur!=='undefined'&&cur!=null&&ix(cur)>=0&&t>=st(cur)-1e-6&&t<=en(cur)+1e-6)?cur:segAt(t);
    for(var q=0;q<spans.length;q++)if(spans[q].id===cid){var sp=spans[q];return (sp.x+Math.max(0,Math.min(sp.b-sp.a,t-sp.a)))/V}
    for(var q2=0;q2<spans.length;q2++)if(spans[q2].a>=t)return spans[q2].x/V;
    var ls=spans[spans.length-1];return (ls.x+ls.b-ls.a)/V;
  }
  for(var i=0;i<spans.length;i++){
    var s=spans[i];
    if(t<s.a)return s.x/V;
    if(t<=s.b)return (s.x+t-s.a)/V;
  }
  var l=spans[spans.length-1];return (l.x+l.b-l.a)/V;
}
function segHitF(f){
  if(spans.length&&spans[0].id!=null){
    var x=f*V;
    for(var i=0;i<spans.length;i++)if(x<=spans[i].x+(spans[i].b-spans[i].a)+1e-9)return spans[i].id;
    return spans[spans.length-1].id;
  }
  return segAt(f2t(f));
}
function f2t(f){
  if(!dur||!spans.length)return 0;
  f=Math.max(0,Math.min(1,f));
  var x=f*V;
  for(var i=0;i<spans.length;i++){
    var s=spans[i],len=s.b-s.a;
    if(x<=s.x+len+1e-9||i===spans.length-1)return s.a+Math.max(0,Math.min(len,x-s.x));
  }
  return 0;
}

/* 실행취소 / 다시실행: 구간(숨김·색·메모 포함), 순서, 반복 범위만 기록 */
function snap(){return JSON.stringify({secs:S.secs,nid:S.nid,order:S.order,n:S.n,nx:S.nx||0,sm:S.sm||0,sc:S.sc||0})}
function resetHistory(){lastSnap=snap();undoSt=[];redoSt=[]}
function fixSel(){
  if(ix(selId)<0)selId=S.order[0];
  if(selLine!=null&&ix(selLine)<1)selLine=null;
  msel.forEach(function(id){if(ix(id)<0)msel.delete(id)});
}
function commit(){
  clampRange();
  var s=snap();
  if(s!==lastSnap){
    undoSt.push(lastSnap);if(undoSt.length>200)undoSt.shift();
    redoSt=[];lastSnap=s;S.mt=Date.now();
  }
  fixSel();save();render();
}
function applySnap(str){
  var o=JSON.parse(str);
  S.secs=o.secs;S.nid=o.nid;S.order=o.order;S.n=o.n;S.nx=o.nx||0;S.sm=o.sm||0;S.sc=o.sc||0;S.mt=Date.now();
  stopMode(true);lastMark=null;fixSel();save();render();
}
function undo(){
  if(!undoSt.length){toast('되돌릴 작업이 없어요');return}
  redoSt.push(lastSnap);lastSnap=undoSt.pop();applySnap(lastSnap);
}
function redo(){
  if(!redoSt.length){toast('다시 할 작업이 없어요');return}
  undoSt.push(lastSnap);lastSnap=redoSt.pop();applySnap(lastSnap);
}
function save(){if(!videoId)return;LS.set('looper:v1:state:'+videoId,S);if(src==='yt')LS.set('looper:v1:last',videoId)}

/* 영상 불러오기 */
function parseId(str){
  str=(str||'').trim();
  var m=str.match(/(?:[?&]v=|youtu\.be\/|embed\/|shorts\/|videoId=)([\w-]{11})/);
  if(m)return m[1];
  if(/^[\w-]{11}$/.test(str))return str;
  return null;
}
function nearestRate(r){
  var best=1,d=9;RATES.forEach(function(x){if(Math.abs(x-r)<d){d=Math.abs(x-r);best=x}});return best;
}
function resetView(){selMode=false;msel.clear();selLine=null;pullMode=false}
function loadVideo(id,rawUrl,noRecent){
  stopMode(true);
  if(src==='local'){
    $('#lv').pause();$('#lv').style.display='none';
    var pe=$('#player');if(pe)pe.style.display='';
  }
  src='yt';
  videoId=id;dur=0;lastMark=null;lastNow=null;armReset=false;resetView();
  var saved=LS.get('looper:v1:state:'+id);
  if(validState(saved)){S=saved}else{
    S=newState();
    var rm=(rawUrl||'').match(/[?&]rate=([\d.]+)/);
    if(rm)S.rate=nearestRate(parseFloat(rm[1]));
  }
  S.flip=!!S.flip;
  selId=S.order[0];
  $('#url').value='';
  $('#msg').textContent='';
  try{history.replaceState(null,'',location.pathname+'?v='+id)}catch(e){}
  if(!noRecent)addRecent(id);
  resetHistory();save();
  if(ytp&&ytReady){player=ytp;ready=true;ytp.cueVideoById(id);setTimeout(applyRate,300)}
  else{player=null;ready=false;if(apiReady&&!ytp)makePlayer()}
  render();
}

/* 내 컴퓨터의 영상·음성 파일 */
var lvEl=$('#lv');
var localAdapter={
  getDuration:function(){return lvEl.duration||0},
  getCurrentTime:function(){return lvEl.currentTime||0},
  seekTo:function(t){try{lvEl.currentTime=t}catch(e){}},
  playVideo:function(){var p=lvEl.play();if(p&&p.catch)p.catch(function(){})},
  pauseVideo:function(){lvEl.pause()},
  getPlayerState:function(){return lvEl.paused?2:1},
  setPlaybackRate:function(r){lvEl.playbackRate=r}
};
lvEl.addEventListener('play',function(){if(src==='local')onState({data:1})});
lvEl.addEventListener('pause',function(){if(src==='local')onState({data:2})});
lvEl.addEventListener('ended',function(){if(src==='local')onState({data:0})});
lvEl.addEventListener('loadedmetadata',function(){
  if(src!=='local')return;
  ready=true;dur=lvEl.duration||0;applyRate();render();
});
lvEl.addEventListener('error',function(){
  if(src==='local')$('#msg').textContent='이 파일은 브라우저에서 재생할 수 없어요. mp4 같은 일반 형식인지 확인하세요.';
});
function loadLocal(file){
  stopMode(true);
  if(ytp&&ytReady){try{ytp.pauseVideo()}catch(e){}}
  var pe=$('#player');if(pe)pe.style.display='none';
  lvEl.style.display='block';
  src='local';player=localAdapter;ready=false;dur=0;lastMark=null;lastNow=null;armReset=false;resetView();
  videoId='local:'+file.name+':'+file.size;
  var saved=LS.get('looper:v1:state:'+videoId);
  S=validState(saved)?saved:newState();
  S.rate=nearestRate(S.rate||1);
  S.flip=!!S.flip;
  selId=S.order[0];
  $('#url').value='';$('#msg').textContent='';
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(localUrl)URL.revokeObjectURL(localUrl);
  localUrl=URL.createObjectURL(file);
  lvEl.src=localUrl;
  resetHistory();save();render();
}

function makePlayer(){
  var opts={playsinline:1,rel:0};
  if(location.protocol==='http:'||location.protocol==='https:')opts.origin=location.origin;
  ytp=new YT.Player('player',{
    videoId:videoId,playerVars:opts,
    events:{
      onReady:function(){
        ytReady=true;
        if(src==='yt'){player=ytp;ready=true;applyRate();dur=player.getDuration()||0;render()}
      },
      onStateChange:function(e){if(src==='yt'){onState(e);setRecentTitle()}},
      onError:function(e){
        var local=location.protocol!=='http:'&&location.protocol!=='https:';
        $('#msg').textContent=(e.data===153||local)
          ?'유튜브가 이 페이지를 막았어요 (오류 '+e.data+'). 파일로 직접 열면 항상 이렇게 됩니다. netlify.com/drop 같은 곳에 이 파일을 올려서 생긴 https 주소로 여세요. 유튜브 없이 연습만 해보려면 위의 "내 영상 파일 열기"를 쓰면 됩니다.'
          :'영상을 재생할 수 없습니다 (오류 '+e.data+'). 링크를 확인하세요. 영상 주인이 삽입을 막았을 수도 있습니다.';
      }
    }
  });
}
window.onYouTubeIframeAPIReady=function(){apiReady=true;if(videoId&&src==='yt'&&!ytp)makePlayer()};
(function(){var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)})();

function applyRate(){if(ready&&player&&player.setPlaybackRate)try{player.setPlaybackRate(S.rate)}catch(e){}}
function onState(e){
  $('#pp').textContent=(e.data===1)?'정지':'재생';
  if(e.data===1){applyRate();if(!dur){dur=player.getDuration()||0;if(dur)render()}}
  if(e.data===0&&(mode==='range'||mode==='single')&&cur!=null)advance();
}

/* 재생 제어 */
function seek(t){guardUntil=performance.now()+500;player.seekTo(Math.max(0,t),true)}
function playAt(t){seek(t);player.playVideo()}
function stopMode(silent){
  mode='idle';cur=null;rep=0;
  if(!silent&&ready)player.pauseVideo();
  updateStatus();
}
function startRange(fromFirst){
  if(!ready||!dur){toast('영상을 먼저 불러오세요');return}
  var list=rangeList();
  if(!list.length){toast(prefs.rev?'제외한 구간이 없어요. 가운데 버튼으로 외운 구간을 제외로 보내세요':'반복할 구간이 없어요. 색 필터나 범위를 확인하세요');return}
  mode='range';cur=(!fromFirst&&list.indexOf(selId)>=0)?selId:list[0];rep=0;
  playAt(st(cur));render();
}
function seekChain(d){
  var list=mode==='single'?[cur]:rangeList();
  var p=list.indexOf(cur);
  if(p<0){list=[cur];p=0}
  var t=0;try{t=player.getCurrentTime()||0}catch(e){}
  var x=Math.max(0,t-st(cur))+d,guard=0;
  while(guard++<2000){
    if(x<0){
      if(p===0){x=0;break}
      p--;x+=en(list[p])-st(list[p]);continue;
    }
    var len=en(list[p])-st(list[p]);
    if(x>=len-0.04){
      x-=len;p++;
      if(p>=list.length)p=0;
      continue;
    }
    break;
  }
  var changed=cur!==list[p];
  cur=list[p];
  playAt(st(cur)+x);
  if(changed){render()}else updateStatus();
}
function startSingle(id){
  if(!ready||!dur)return;
  mode='single';cur=id;rep=0;selId=id;
  playAt(st(id));render();
}
function preview(a,b){
  if(!ready||!dur)return;
  mode='preview';cur=null;stopAt=b;playAt(a);updateStatus();
}
function advance(){
  if(mode==='single'){playAt(st(cur));return}
  rep++;
  if(rep<S.reps){playAt(st(cur));return}
  rep=0;
  var list=rangeList();if(!list.length){stopMode();return}
  var prev=cur,p=list.indexOf(cur);p=(p+1)%list.length;cur=list[p];
  if(cur!==prev&&Math.abs(st(cur)-en(prev))<1e-6){updateStatus();return}
  playAt(st(cur));updateStatus();
}

setInterval(function(){
  if(!ready||!player)return;
  var t=0;try{t=player.getCurrentTime()||0}catch(e){return}
  if(!dur){dur=player.getDuration()||0;if(dur)render()}
  updateClock(t);
  if(performance.now()<guardUntil)return;
  if(mode==='preview'&&t>=stopAt-0.03){player.pauseVideo();mode='idle';updateStatus();return}
  if((mode==='range'||mode==='single')&&cur!=null&&ix(cur)>=0){
    var a=st(cur),b=en(cur);
    if(t>=b-0.04||t<a-0.4)advance();
  }
},40);

function updateClock(t){
  $('#now').textContent=fmt(t);
  if(prefs.zoom==='auto'&&!zDet&&dur&&!tdrag&&zInfo&&Math.abs(t-zLastT)>=Math.max(0.02,zInfo.L/($('#tl').clientWidth||600)))renderTimeline();
  var h=$('#head');if(h&&dur)h.style.left='calc('+(t2f(t)*100)+'% - 1px)';
  if(!dur)return;
  var now=null;
  for(var i=S.secs.length-1;i>=0;i--){if(S.secs[i].s<=t){now=S.secs[i].id;break}}
  if(now!==lastNow){
    lastNow=now;
    var rows=document.querySelectorAll('#list .item');
    for(var k=0;k<rows.length;k++)rows[k].classList.toggle('now',Number(rows[k].dataset.id)===now);
  }
}

/* 자르기 */
function boundsOk(k,t){
  var lo=S.secs[k-1].s+0.2;
  var hi=(S.secs[k+1]?S.secs[k+1].s:dur)-0.2;
  return t>=lo&&t<=hi;
}
function mark(){
  if(!ready||!dur){toast('영상을 불러온 뒤에 컷할 수 있어요');return}
  if(customView()){toast('커스텀순에서는 컷할 수 없어요. 구간 목록에서 원래순으로 바꿔 주세요');return}
  var t=Math.round(player.getCurrentTime()*10)/10;
  var nowW=performance.now();
  if(pullMode){
    var best=-1,bd=Infinity,N=prefs.pullN;
    for(var q=1;q<S.secs.length;q++){
      if(S.secs[q].g)continue;
      var dd=Math.abs(S.secs[q].s-t);
      if(dd<=N+1e-9&&dd<bd){bd=dd;best=q}
    }
    if(best>0){
      var bo=lineBounds(best);
      if(t<bo.lo-1e-9||t>bo.hi+1e-9){toast('이웃한 선과 0.2초 이상 떨어져야 해요');return}
      var from=S.secs[best].s;
      S.secs[best].s=t;S.secs[best].g=1;
      lastMark=null;stopMode(true);commit();
      toast('선을 '+fmt(from)+'에서 '+fmt(t)+'로 당겼어요');
      playAt(Math.max(0,t-1));
      return;
    }
  }
  var i=0;for(var j=0;j<S.secs.length;j++){if(S.secs[j].s<=t)i=j}
  if(t-S.secs[i].s<0.2||en(S.secs[i].id)-t<0.2){toast('다른 지점과 너무 가까워요');return}
  var prevSeg=S.secs[i],prevId=prevSeg.id,id=S.nid++;
  var nw={id:id,s:t};
  if(prevSeg.h)nw.h=true;
  if(pullMode)nw.g=2;
  S.secs.splice(i+1,0,nw);
  if(!prevSeg.h){
    var p=S.order.indexOf(prevId);
    S.order.splice(p+1,0,id);
    if(S.n!==0&&p+1<=S.n)S.n++;
  }
  lastMark={id:id,w:nowW,t:t,prev:prevId};
  selId=prevId;
  stopMode(true);
  commit();
  toast(fmt(t)+'에서 컷했어요 ('+S.secs.length+'개 구간)');
  playAt(Math.max(0,t-1));
}
function undoMark(){
  if(!lastMark||ix(lastMark.id)<1){toast('취소할 것이 없어요');return}
  mergeAt(ix(lastMark.id)-1);lastMark=null;
}

/* 선(컷 지점) 합치기·이동 */
function dropLine(k){
  if(k<1||k>=S.secs.length)return;
  var dp=S.secs[k],pv=S.secs[k-1],drop=dp.id,keep=pv.id;
  var pd=S.order.indexOf(drop);
  if(pv.h&&!dp.h){pv.h=false;S.order[pd]=keep}
  else if(pd>=0){S.order.splice(pd,1);if(S.n>1&&pd+1<=S.n)S.n--}
  if(!pv.c&&dp.c)pv.c=dp.c;
  if(!pv.m&&dp.m)pv.m=dp.m;
  S.secs.splice(k,1);
  if(cur===drop)stopMode(true);
  if(selId===drop)selId=keep;
  if(selLine===drop)selLine=null;
  msel.delete(drop);
}
function mergeAt(i){
  if(i<0||i>=S.secs.length-1)return;
  var keep=S.secs[i].id;
  dropLine(i+1);
  selId=keep;commit();
}
function deleteSel(){
  if(!msel.size){toast('선택한 구간이 없어요');return}
  var lines={};
  msel.forEach(function(id){var i=ix(id);if(i<0)return;lines[i>0?i:1]=1});
  var ks=Object.keys(lines).map(Number).filter(function(k){return k>=1&&k<S.secs.length}).sort(function(a,b){return b-a});
  if(!ks.length){toast('합칠 구간이 없어요');return}
  stopMode(true);
  ks.forEach(dropLine);
  msel.clear();commit();
  toast('컷 선 '+ks.length+'개를 없앴어요 (실행취소로 되돌릴 수 있어요)');
}
function deleteLine(){
  if(selLine==null)return;
  var k=ix(selLine);if(k<1)return;
  stopMode(true);dropLine(k);commit();toast('컷 선을 없앴어요');
}
function lineBounds(k){
  return {lo:S.secs[k-1].s+0.2,hi:(S.secs[k+1]?S.secs[k+1].s:dur)-0.2};
}
function moveLine(k,d){
  if(k<1||k>=S.secs.length)return;
  var b=lineBounds(k);
  var v=Math.round((S.secs[k].s+d)*10)/10;
  var clamped=false;
  if(v<b.lo){v=Math.ceil(b.lo*10)/10;clamped=true}
  if(v>b.hi){v=Math.floor(b.hi*10)/10;clamped=true}
  if(clamped)toast('이웃한 선과 겹치지 않는 곳까지만 움직여요');
  S.secs[k].s=v;
  stopMode(true);commit();
  preview(Math.max(0,v-1.2),v+0.8);
}
function shiftAll(d){
  if(S.secs.length<2){toast('옮길 선이 없어요');return}
  var f=S.secs[1].s+d,l=S.secs[S.secs.length-1].s+d;
  if(f<0.2-1e-9||l>dur-0.2+1e-9){toast('끝에 닿아서 더 옮길 수 없어요');return}
  for(var k=1;k<S.secs.length;k++)S.secs[k].s=Math.round((S.secs[k].s+d)*100)/100;
  stopMode(true);commit();
  toast('선 '+(S.secs.length-1)+'개를 '+(d>0?'+':'')+d+'초 옮겼어요');
}

/* 경계 조정 (선택한 구간의 시작/끝) */
function adjust(which,d){
  var i=ix(selId);if(i<0)return;
  if(which==='start'&&i===0)return;
  if(which==='end'&&i===S.secs.length-1)return;
  var k=which==='start'?i:i+1;
  var b=lineBounds(k);
  var v=Math.round((S.secs[k].s+d)*10)/10;
  var clamped=false;
  if(v<b.lo){v=Math.ceil(b.lo*10)/10;clamped=true}
  if(v>b.hi){v=Math.floor(b.hi*10)/10;clamped=true}
  S.secs[k].s=v;
  if(clamped)toast('이웃한 구간과 겹치지 않는 곳까지만 움직여요');
  stopMode(true);commit();
  var a=st(selId),e=en(selId);
  if(which==='start')preview(a,Math.min(e,a+4));
  else preview(Math.max(a,e-1.2),e+0.5);
}

/* 순서 */
function move(id,how){
  var o=S.order,p=o.indexOf(id);if(p<0)return;
  var r=rEnd(),lo=p<r?0:r,hi=p<r?r-1:o.length-1;
  var edge=(how==='front'||how==='up')?p===lo:p===hi;
  if(edge){toast('이미 '+(p<r?'학습':'제외')+' 그룹의 맨 '+((how==='front'||how==='up')?'앞':'뒤')+'이에요. 다른 그룹으로 보내려면 가운데를 누르세요');return}
  o.splice(p,1);
  if(how==='front')o.splice(lo,0,id);
  else if(how==='back')o.splice(hi,0,id);
  else if(how==='up')o.splice(p-1,0,id);
  else o.splice(p+1,0,id);
  commit();
}
function moveMid(id){
  var o=S.order,p=o.indexOf(id),r=rEnd();
  if(p<0)return;
  if(S.sm>0){
    if(p>=S.sm){o.splice(p,1);o.splice(S.sm,0,id);S.sm++;commit();toast('다시 넣었어요. 소거 범위 '+S.sm+'개');return}
    if(S.sm<=1){S.sm=0;stopMode(true);commit();toast('소거를 마쳤어요. 소거 모드를 껐어요');return}
    o.splice(p,1);o.splice(S.sm-1,0,id);S.sm--;
    commit();toast('소거했어요. 남은 범위 '+S.sm+'개');return;
  }
  if(p<r){
    if(r<=1){toast('반복 범위에는 최소 1개가 있어야 해요');return}
    o.splice(p,1);o.splice(r-1,0,id);S.n=r-1;
    toast('범위에서 빼서 제외 구간의 맨 위에 뒀어요');
  }else{
    o.splice(p,1);o.splice(r,0,id);S.n=r+1;
    toast('반복 범위의 맨 아래로 넣었어요');
  }
  commit();
}

/* 숨김, 색, 메모 */
function setHidden(ids,hide){
  var changed=0,blocked=false;
  ids.forEach(function(id){
    var i=ix(id);if(i<0)return;
    var sg=S.secs[i];
    if(hide&&!sg.h){
      if(S.order.length<=1){blocked=true;return}
      var p=S.order.indexOf(id);
      S.order.splice(p,1);
      if(S.n>1&&p+1<=S.n)S.n--;
      sg.h=true;changed++;
      if(cur===id)stopMode(true);
    }else if(!hide&&sg.h){
      sg.h=false;S.order.push(id);changed++;
    }
  });
  if(!changed){toast(blocked?'보이는 구간이 최소 1개는 있어야 해요':(hide?'숨길 구간이 없어요':'숨김 해제할 구간이 없어요'));return}
  msel.clear();
  commit();
  toast((hide?'구간 '+changed+'개를 숨겼어요. 번호가 다시 매겨졌어요':'구간 '+changed+'개를 다시 보이게 했어요. 커스텀 순서 맨 아래에 들어갔어요')+(blocked?' (마지막 1개는 남겼어요)':''));
}
function setColor(ids,c){
  var n=0;
  ids.forEach(function(id){var i=ix(id);if(i>=0){if(c)S.secs[i].c=c;else delete S.secs[i].c;n++}});
  if(n)commit();
}
function cycleColor(id){
  var i=ix(id);if(i<0)return;
  setColor([id],((S.secs[i].c||0)+1)%4);
}
function selByLen(le){
  var th=parseFloat($('#thr').value);
  if(!(th>0)){toast('길이를 0보다 크게 입력하세요');return}
  prefs.thr=th;savePrefs();
  msel.clear();
  S.secs.forEach(function(sg){
    if(sg.h)return;
    var L=en(sg.id)-sg.s;
    if(le?L<=th+1e-9:L>=th-1e-9)msel.add(sg.id);
  });
  render();
  toast(msel.size?('길이 '+th+'초 '+(le?'이하':'이상')+' 구간 '+msel.size+'개를 선택했어요'):('해당하는 구간이 없어요'));
}

/* 엑셀용 복사: 원래 번호 순서대로 줄마다 커스텀 순번, 색, 메모 */
function excelText(){
  var lines=[];
  S.secs.forEach(function(sg){
    if(sg.h)return;
    var p=S.order.indexOf(sg.id)+1;
    var memo=(sg.m||'').replace(/[\t\r\n]+/g,' ');
    lines.push(p+'\t'+CNAMES[sg.c||0]+'\t'+memo+'\t'+(sg.nm||'').replace(/[\t\r\n]+/g,' '));
  });
  return lines.join('\n');
}

function renderTimeline(){
  var tl=$('#tl');
  buildMap();
  if(!dur){tl.innerHTML='<b class="head" id="head"></b>';return}
  var inR={};rangeList().forEach(function(id){inR[id]=1});
  var w=tl.clientWidth||600,h='';
  if(customView()){
    var hc='';
    spans.forEach(function(sp,i){
      var id=sp.id,x=S.secs[ix(id)],fw=(sp.b-sp.a)/V,lab='';
      if(fw*w>=18){
        var o=onum(id);
        if(prefs.barNum==='orig')lab='<b>'+o+'</b>';
        else if(prefs.barNum==='custom')lab='<b>'+(i+1)+'</b>';
        else lab='<b>'+o+'</b><em>'+(i+1)+'</em>';
      }

    });
    hc+='<b class="head" id="head"></b>';
    tl.innerHTML=hc;return;
  }
  S.secs.forEach(function(x,i){
    if(prefs.fold&&x.h)return;

      var o=onum(x.id);

      else if(prefs.barNum==='custom')lab='<b>'+(p+1)+'</b>';

  var ids=prefs.sort==='custom'?S.order.slice():S.secs.filter(function(g){return !g.h}).map(function(g){return g.id});
  var n=Math.min(ids.length,lines.length),blank=0;
  for(var k=0;k<n;k++){
    var cols=lines[k].split('\t').map(function(x){return x.trim()}),no='',nm='';
    var g=S.secs[ix(ids[k])];
    if(cols.every(function(x){return !x})){delete g.nm;delete g.no;delete g.m;blank++;continue}
    if(cols.length>=2&&/^\d+$/.test(cols[0])){no=cols[0];nm=cols[1]}else{nm=cols[0]}
    if(nm)g.nm=nm;else delete g.nm;
    if(no)g.no=no;else delete g.no;
  }
  commit();
  var extra=lines.length-n,where=' ('+(prefs.sort==='custom'?'커스텀순':'원래순')+' 기준)',more=extra>0?' · 구간이 모자라서 '+extra+'줄은 넣지 못했어요':'';
  if(blank===n)toast(n+'개 구간의 이름·메모를 비웠어요'+where+more);
  else toast((n-blank)+'개 구간에 이름을 넣었어요'+where+(blank?' · 빈 줄 '+blank+'개는 이름·메모를 비웠어요':'')+more);

var tlEl=$('#tl'), tdrag=null;
function hitLine(x,w,ptype){
  var thr=ptype==='touch'?16:10,best=-1,bd=thr+1;
  for(var k=1;k<S.secs.length;k++){
    if(zInfo&&(S.secs[k].s<zInfo.ws||S.secs[k].s>zInfo.we))continue;
    var d=Math.abs(t2f(S.secs[k].s)*w-x);
    if(d<bd){bd=d;best=k}
  }
  return best;
}
function curTime(){try{return player?player.getCurrentTime()||0:0}catch(e){return 0}}
tlEl.addEventListener('pointerdown',function(e){
  if(!dur||!S||e.button>0)return;
  var r=tlEl.getBoundingClientRect(),x=e.clientX-r.left;
  tdrag={x0:x,pid:e.pointerId,moved:false,kind:'click',w:r.width,add:e.shiftKey||e.ctrlKey||e.metaKey};
  if(selMode)tdrag.kind='box';
  else if(!customView()){
    var k=hitLine(x,r.width,e.pointerType);
    if(k>0){
      tdrag.kind='line';tdrag.k=k;tdrag.snapped=null;tdrag.spent=false;
      tdrag.cands=[curTime()];
      for(var j=1;j<S.secs.length;j++)if(j!==k)tdrag.cands.push(S.secs[j].s);
      selLine=S.secs[k].id;
    }
  }
  if(tdrag.kind==='click'&&prefs.zoom==='auto'&&zInfo){
    var td=tdrag;
    td.timer=setTimeout(function(){
      if(tdrag!==td||td.moved)return;
      td.kind='pan';td.zc0=zDet?zC:curTime();
      tlEl.classList.add('panmode');try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
    },1000);
  }
  try{tlEl.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
tlEl.addEventListener('pointermove',function(e){
  if(!tdrag||e.pointerId!==tdrag.pid)return;
  var r=tlEl.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));
  if(!tdrag.moved&&Math.abs(x-tdrag.x0)>4){tdrag.moved=true;if(tdrag.kind!=='pan'&&tdrag.timer){clearTimeout(tdrag.timer);tdrag.timer=null}}
  if(tdrag.kind==='pan'){
    if(!zInfo)return;
    var cc=tdrag.zc0-(x-tdrag.x0)/r.width*zInfo.L;
    zC=Math.max(0,Math.min(dur,cc));zDet=true;
    renderTimeline();zoomUi();
    var hh=$('#head');if(hh)hh.style.left='calc('+(t2f(curTime())*100)+'% - 1px)';
    return;
  }
  if(!tdrag.moved)return;
  if(tdrag.kind==='box'){
    var bx=$('#box');
    if(!bx){bx=document.createElement('div');bx.id='box';tlEl.appendChild(bx)}
    var l=Math.min(x,tdrag.x0),wd=Math.abs(x-tdrag.x0);
    bx.className='box '+(x>=tdrag.x0?'win':'cross');
    bx.style.left=l+'px';bx.style.width=wd+'px';
  }else if(tdrag.kind==='line'){
    if(prefs.fold&&hiddenCount())return;
    var t=f2t(x/r.width),thrT=8/r.width*V,k=tdrag.k;
    if(!tdrag.spent){
      if(tdrag.snapped!=null){
        if(Math.abs(t-tdrag.snapped)<=thrT*1.6)t=tdrag.snapped;
        else{tdrag.spent=true;tdrag.snapped=null}
      }else{
        var best=null,bd=thrT;
        tdrag.cands.forEach(function(c){var d=Math.abs(t-c);if(d<bd){bd=d;best=c}});
        if(best!=null){tdrag.snapped=best;t=best}
      }
    }
    var b=lineBounds(k);
    t=Math.max(b.lo,Math.min(b.hi,t));
    S.secs[k].s=tdrag.snapped!=null?Math.round(t*100)/100:Math.round(t*10)/10;
    renderTimeline();
    var h=$('#head');if(h)h.style.left='calc('+(t2f(curTime())*100)+'% - 1px)';
  }
});
function endTl(e,cancel){
  if(!tdrag||e.pointerId!==tdrag.pid)return;
  var d=tdrag;tdrag=null;if(d.timer)clearTimeout(d.timer);tlEl.classList.remove('panmode');
  try{tlEl.releasePointerCapture(e.pointerId)}catch(_){}
  if(d.kind==='pan'){renderTimeline();zoomUi();return}
  var bx=$('#box');if(bx)bx.remove();
  var r=tlEl.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));
  if(cancel){if(d.kind==='line'){S.secs[d.k].s=JSON.parse(lastSnap).secs[d.k].s}render();return}
  if(d.kind==='box'){
    if(!d.moved){
      var hit=segHitF(x/r.width);
      if(d.add){msel.has(hit)?msel.delete(hit):msel.add(hit)}
      else{var had=msel.has(hit)&&msel.size===1;msel.clear();if(!had)msel.add(hit)}
      selId=hit;render();return;
    }
    var t1=f2t(Math.min(x,d.x0)/r.width),t2=f2t(Math.max(x,d.x0)/r.width),win=x>=d.x0;
    if(!d.add)msel.clear();
    if(customView()){
      var g1=Math.min(x,d.x0)/r.width,g2=Math.max(x,d.x0)/r.width;
      spans.forEach(function(sp){var fa=sp.x/V,fb=(sp.x+sp.b-sp.a)/V;if(win?(fa>=g1-1e-6&&fb<=g2+1e-6):(fa<g2&&fb>g1))msel.add(sp.id)});
      render();return;
    }
    S.secs.forEach(function(sg){
      if(prefs.fold&&sg.h)return;
      var a=sg.s,b=en(sg.id);
      if(win?(a>=t1-1e-6&&b<=t2+1e-6):(a<t2&&b>t1))msel.add(sg.id);
    });
    render();return;
  }
  if(d.kind==='line'){
    if(!d.moved||(prefs.fold&&hiddenCount())){render();return}
    var nt=S.secs[d.k].s;
    stopMode(true);commit();
    preview(Math.max(0,nt-1.2),nt+0.8);
    return;
  }
  /* 그냥 누름: 이동 */
  var t=f2t(x/r.width),hitId=segHitF(x/r.width);
  selLine=null;
  if(mode==='range'){
    var list=rangeList();
    if(list.indexOf(hitId)>=0){cur=hitId;rep=0;selId=hitId;seek(t)}
    else{cur=list[0];rep=0;seek(st(cur))}
  }else if(mode==='single'){
    cur=hitId;rep=0;selId=hitId;seek(t);
  }else{
    if(mode!=='idle')stopMode(true);
    selId=hitId;seek(t);
  }
  render();
}

function nCtl(kind){
  var n=S.order.length;
  if(prefs.rev){
    var ex=n-rEnd();if(!ex)return;
    if(kind==='minus'){if(ex<2)return;S.nx=!S.nx?ex-1:Math.max(1,S.nx-1)}
    else if(kind==='plus'){if(!S.nx)return;S.nx++}
    else S.nx=0;
    commit();return;
  }
  if(kind==='minus'){if(n<2)return;S.n=S.n===0?n-1:Math.max(1,S.n-1)}
  else if(kind==='plus'){if(S.n===0)return;S.n++}
  else S.n=0;
  commit();
}
function smVal(){var n=S.order.length;return Math.max(1,Math.min(n,S.sm>0?S.sm:(S.sc||rEnd())))}
function smCtl(d){
  var n=S.order.length,v=smVal()+d;if(v<1||v>n)return;
  if(S.sm>0)S.sm=v;S.sc=v;commit();
}

function ldragRows(){
  return Array.prototype.filter.call(listEl.children,function(el){
    return el!==ldrag.li&&(el.classList.contains('item')||el.classList.contains('divider'));
  });
}
function ldragPlace(y){
  var rows=ldragRows(),i=0;
  for(;i<rows.length;i++){
    var rc=rows[i].getBoundingClientRect();
    if(y<rc.top+rc.height/2)break;
  }
  ldrag.idx=i;
  if(i<rows.length)listEl.insertBefore(ldrag.drop,rows[i]);else listEl.appendChild(ldrag.drop);
}
function startLDrag(){
  ldrag.active=true;
  ldrag.li.classList.add('dragging');
  ldrag.drop=document.createElement('li');ldrag.drop.className='dropline';
  ldragPlace(ldrag.y);
  try{listEl.setPointerCapture(ldrag.pid)}catch(_){}
}
function endLDrag(apply){
  var d=ldrag;ldrag=null;
  clearTimeout(d.timer);
  try{listEl.releasePointerCapture(d.pid)}catch(_){}
  if(!d.active)return;
  justDragged=true;setTimeout(function(){justDragged=false},60);
  if(d.drop&&d.drop.parentNode)d.drop.remove();
  d.li.classList.remove('dragging');
  if(!apply){render();return}
  ldrag={li:d.li};
  var rows=ldragRows();ldrag=null;
  var seq=rows.map(function(el){return el.classList.contains('divider')?{d:1}:{id:Number(el.dataset.id)}});
  seq.splice(d.idx,0,{id:d.id});
  var cnt=0;for(var q=0;q<seq.length;q++){if(seq[q].d)break;cnt++}
  var newOrder=seq.filter(function(x){return x.id!=null}).map(function(x){return x.id});
  if(prefs.rev){
    var before=seq.slice(0,cnt).map(function(x){return x.id}),after=seq.slice(cnt+1).map(function(x){return x.id});
    if(!after.length){toast('학습 구간에는 최소 1개가 있어야 해요');render();return}
    S.order=after.concat(before);
    S.n=before.length?after.length:0;
  }else{
    if(cnt===0){toast('반복 범위에는 최소 1개가 있어야 해요');render();return}
    S.order=newOrder;
    S.n=cnt>=newOrder.length?0:cnt;
  }
  selId=d.id;
  commit();
}

  ldrag={id:Number(li.dataset.id),li:li,sx:e.clientX,sy:e.clientY,y:e.clientY,pid:e.pointerId,active:false,touch:e.pointerType==='touch',timer:null,idx:0};

});
listEl.addEventListener('pointermove',function(e){
  if(!ldrag||e.pointerId!==ldrag.pid)return;
  ldrag.y=e.clientY;
  if(!ldrag.active){
    var dist=Math.hypot(e.clientX-ldrag.sx,e.clientY-ldrag.sy);
    if(ldrag.touch){if(dist>8){clearTimeout(ldrag.timer);ldrag=null}}
    else if(dist>5)startLDrag();
    return;
  }
  var lr=listEl.getBoundingClientRect();
  if(e.clientY<lr.top+30)listEl.scrollTop-=10;
  else if(e.clientY>lr.bottom-30)listEl.scrollTop+=10;
  ldragPlace(e.clientY);
});

var listActive=false,lastArrow={k:'',t:0};

function listNav(d){
  var ids=Array.prototype.map.call(listEl.querySelectorAll('.item'),function(el){return Number(el.dataset.id)});
  if(!ids.length)return;
  var i=ids.indexOf(selId),j=i<0?0:Math.max(0,Math.min(ids.length-1,i+d));
  if(i>=0&&j===i)return;
  var id=ids[j],pl=false;try{pl=!!ready&&player.getPlayerState()===1}catch(_){}
  selId=id;selLine=null;render();
  var li=listEl.querySelector('.item[data-id="'+id+'"]');if(li&&li.scrollIntoView)li.scrollIntoView({block:'nearest'});
  if(!pl)return;

function listRestart(){
  if(!ready||!dur)return;
  if((mode==='range'||mode==='single')&&cur!=null&&ix(cur)>=0){rep=0;playAt(st(cur));updateStatus();return}
  if(selId!=null&&ix(selId)>=0){stopMode(true);preview(st(selId),en(selId));render()}
}
function listKey(e){
  var c=e.code;
  if(e.repeat&&c!=='ArrowUp')return false;
  var okSel=S&&selId!=null&&S.order.indexOf(selId)>=0;
  if(c==='KeyA'){listNav(-1)}
  else if(c==='KeyD'){listNav(1)}
  else if(c==='KeyW'){$('#pp').click()}
  else if(c==='KeyS'){listRestart()}
  else if(c==='KeyQ'){undo()}
  else if(c==='KeyE'){redo()}
  else if(c==='ArrowUp'){if(e.repeat)return true;$('#smode').click()}
  else if(c==='ArrowDown'){if(okSel)itemAct(selId,'mid')}
  else if(c==='ArrowLeft'||c==='ArrowRight'){
    var now=Date.now(),dbl=lastArrow.k===c&&now-lastArrow.t<350;lastArrow={k:c,t:dbl?0:now};
    if(okSel)itemAct(selId,c==='ArrowLeft'?(dbl?'front':'up'):(dbl?'back':'down'));
  }
  else return false;
  return true;
}
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    var k=(e.key||'').toLowerCase();
    if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}
    else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}
    return;
  }
  if(e.metaKey||e.altKey)return;
  if(listActive&&!e.shiftKey&&listKey(e)){e.preventDefault();return}
  if(e.key==='m'||e.key==='M'||e.key==='ㅡ'){e.preventDefault();mark()}
  else if(e.key===' '){e.preventDefault();$('#pp').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(ready){if(mode!=='idle')stopMode(true);seek(player.getCurrentTime()-1)}}
  else if(e.key==='ArrowRight'){e.preventDefault();if(ready){if(mode!=='idle')stopMode(true);seek(player.getCurrentTime()+1)}}
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(msel.size){e.preventDefault();deleteSel()}
    else if(selLine!=null){e.preventDefault();deleteLine()}
  }
});

function applyUI(){
  var rs=document.documentElement.style,v={};
  UIDEF.forEach(function(d){v[d.k]=uiVal(d)});
  rs.setProperty('--fs',v.fs+'px');
  rs.setProperty('--tlh',v.tlh+'px');
  rs.setProperty('--lf',v.lf+'fr');
  rs.setProperty('--vw',v.vw+'%');

  rs.setProperty('--gap',v.gap+'px');
  rs.setProperty('--btnh',v.btnh+'px');
  rs.setProperty('--btnsm',(v.btnh-6)+'px');
  if(UI.accent){
    rs.setProperty('--accent',UI.accent);
    rs.setProperty('--accent-soft','color-mix(in srgb,'+UI.accent+' 18%,transparent)');
  }else{rs.removeProperty('--accent');rs.removeProperty('--accent-soft')}
  if(UI.mark)rs.setProperty('--mark',UI.mark);else rs.removeProperty('--mark');
  if(UI.theme==='light'||UI.theme==='dark')document.documentElement.setAttribute('data-theme',UI.theme);
  else document.documentElement.removeAttribute('data-theme');

function buildTuner(){
  $('#tunerows').innerHTML=UIDEF.map(function(d){
    return '<div class="tr"><label for="tu-'+d.k+'">'+d.label+'</label><input type="range" id="tu-'+d.k+'" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" value="'+uiVal(d)+'"><output id="to-'+d.k+'">'+uiVal(d)+d.unit+'</output></div>';
  }).join('');
  UIDEF.forEach(function(d){
    $('#tu-'+d.k).addEventListener('input',function(){
      UI[d.k]=Number(this.value);$('#to-'+d.k).textContent=this.value+d.unit;
      applyUI();saveUI();if(S&&dur)renderTimeline();
    });
  });
  $('#tc-theme').value=UI.theme||'auto';
  var cs=getComputedStyle(document.documentElement);
  function hex(c){
    c=(c||'').trim();
    if(/^#[0-9a-f]{6}$/i.test(c))return c;
    if(/^#[0-9a-f]{3}$/i.test(c))return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    return '#2352e6';
  }
  $('#tc-accent').value=hex(UI.accent||cs.getPropertyValue('--accent'));
  $('#tc-mark').value=hex(UI.mark||cs.getPropertyValue('--mark'));
}

(function(){

    else{F[j].x=ed.x;F[j].y=ed.y;delete F[j].att}
  });

})();
function foldGroup(key){
  if(!prefs.link[key])return [key];
  var out={},q=[key];out[key]=true;
  function nb(m){
    var r=[];
    if(freeOn()){
      var F=prefs.free.cards;
      if(F[m]&&F[m].att&&(F[m].att.side==='b'||F[m].att.side==='t'))r.push(F[m].att.to);
      Object.keys(F).forEach(function(j){if(F[j].att&&F[j].att.to===m&&(F[j].att.side==='b'||F[j].att.side==='t'))r.push(j)});
    }else{
      var cs=[].slice.call(document.querySelectorAll('.stack>[data-fold]')),i=-1;
      cs.forEach(function(c,n){if(c.dataset.fold===m)i=n});
      if(i>0)r.push(cs[i-1].dataset.fold);
      if(i>=0&&i<cs.length-1)r.push(cs[i+1].dataset.fold);
    }
    return r;
  }
  while(q.length){
    var m=q.pop();
    nb(m).forEach(function(j){if(!out[j]&&prefs.link[j]&&document.querySelector('[data-fold="'+j+'"]')){out[j]=true;q.push(j)}});
  }

}

function layoutFree(ov,noRes){

    R={};

        var p=res(c.att.to,stk.concat(k)),a=c.att;
        if(p){
          if(a.side==='b'){r={x:p.x,y:p.y+p.h};w=p.w}
          else if(a.side==='t'){r={x:p.x,y:p.y-h};w=p.w}
          else if(a.side==='r')r={x:p.x+p.w,y:p.y+a.off};
          else r={x:p.x-w,y:p.y+a.off};
        }

      if(!r)r={x:c.x,y:c.y};

    }
    Object.keys(els).forEach(function(k){res(k,[])});

  function rootOf(k){var g=0;while(F.cards[k]&&F.cards[k].att&&els[F.cards[k].att.to]&&g++<30)k=F.cards[k].att.to;return k}
  function isAnc(a,k){var g=0;while(F.cards[k]&&F.cards[k].att&&g++<30){k=F.cards[k].att.to;if(k===a)return true}return false}
  calc();
  if(!ov&&!noRes){
    // 접고 펼치다가 겹치면 아래 카드를 밀어 내린다
    for(var tries=0;tries<40;tries++){
      var ks=Object.keys(R),hit=null;
      for(var i=0;i<ks.length&&!hit;i++)for(var j=0;j<ks.length&&!hit;j++){
        if(i===j)continue;
        var A=R[ks[i]],B=R[ks[j]];
        if((A.y<B.y||(A.y===B.y&&A.x<=B.x))&&A.x<B.x+B.w-1&&B.x<A.x+A.w-1&&A.y<B.y+B.h-1&&B.y<A.y+A.h-1)hit=[ks[i],ks[j]];

  }

/* 다른 카드의 위쪽에 붙은 카드는 펼칠 때 위로 늘어나므로, 위 카드를 기준(고정)으로 하고 아래 카드를 그 밑에 붙이는 쪽으로 바꾼다 */
function normTop(){
  if(!freeOn()||!prefs.free.cards)return false;
  var F=prefs.free.cards,ch=false,guard=0;
  for(var again=true;again&&guard++<20;){
    again=false;
    var R=layoutFree(null,true);if(!R)return ch;
    var ks=Object.keys(F);
    for(var i=0;i<ks.length;i++){
      var c=ks[i],a=F[c].att;
      if(!(a&&a.side==='t'&&F[a.to]&&R[c]))continue;
      var p=a.to,pa=F[p].att;
      if(pa){F[c].att={to:pa.to,side:pa.side,off:pa.off||0}}
      else{F[c].x=Math.round(R[c].x);F[c].y=Math.round(R[c].y);delete F[c].att}
      var end=c,g=0,go=true;
      while(go&&g++<30){go=false;Object.keys(F).forEach(function(j){if(!go&&j!==p&&j!==end&&F[j].att&&F[j].att.to===end&&F[j].att.side==='b'){end=j;go=true}})}
      F[p].att={to:end,side:'b',off:0};

    }

  var R3=layoutFree(null,true),mx=0,my=0;
  if(R3){Object.keys(R3).forEach(function(j){mx=Math.min(mx,R3[j].x);my=Math.min(my,R3[j].y)});
    if(mx<0||my<0)Object.keys(F).forEach(function(j){if(!F[j].att){F[j].x-=mx;F[j].y-=my}});}
  if(ch)savePrefs();

}

function snapCalc(d,nx,ny){

      [[o.x+o.w,'r',1],[o.x-w,'l',1],[o.x,0,0],[o.x+o.w-w,0,0]].forEach(function(q){
        var dd=Math.abs(nx-q[0]);if(dd<=T&&(!bx||dd<bx.dd))bx={dd:dd,v:q[0],side:q[1],adj:q[2],j:j};
      });
    }

      [[o.y+o.h,'b',1],[o.y-h,'t',1],[o.y,0,0],[o.y+o.h-h,0,0]].forEach(function(q){
        var dd=Math.abs(ny-q[0]);if(dd<=T&&(!by||dd<by.dd))by={dd:dd,v:q[0],side:q[1],adj:q[2],j:j};
      });
    }
  });

    if(!b||!b.adj)return null;
    var o=d.others[b.j];

    d.tgt=tgt;
  }
  var ov={};d.roots.forEach(function(m){ov[m]={x:d.start[m].x+sn.x-d.x0,y:d.start[m].y+sn.y-d.y0}});
  layoutFree(ov);
});
function rectHit(a,b){return a.x<b.x+b.w-1&&b.x<a.x+a.w-1&&a.y<b.y+b.h-1&&b.y<a.y+a.h-1}
function groupHits(d,R2){
  var ks=Object.keys(d.G).filter(function(m){return R2[m]});
  return ks.some(function(m){return Object.keys(R2).some(function(j){return !d.G[j]&&rectHit(R2[m],R2[j])})});
}
function freeSpot(d,R2,cx,cy){
  var rel=[],mr=0,mbm=0;
  Object.keys(d.G).forEach(function(m){
    if(!R2[m])return;
    var q={dx:R2[m].x-R2[d.lead].x,dy:R2[m].y-R2[d.lead].y,w:R2[m].w,h:R2[m].h};
    rel.push(q);mr=Math.max(mr,q.dx+q.w);mbm=Math.max(mbm,q.dy+q.h);
  });
  var oth=Object.keys(d.others).map(function(j){return d.others[j]});
  var X=[cx],Y=[cy];
  oth.forEach(function(o){X.push(o.x+o.w,o.x-mr,o.x);Y.push(o.y+o.h,o.y-mbm,o.y)});
  function ok(x,y){
    if(x<0||y<0)return false;
    return !rel.some(function(q){var a={x:x+q.dx,y:y+q.dy,w:q.w,h:q.h};return oth.some(function(o){return rectHit(a,o)})});
  }
  var best=null;
  X.forEach(function(x){Y.forEach(function(y){
    if(!ok(x,y))return;
    var dd=Math.hypot(x-cx,y-cy);if(!best||dd<best.dd)best={x:x,y:y,dd:dd};
  })});
  if(!best){var bot=0;oth.forEach(function(o){bot=Math.max(bot,o.y+o.h)});best={x:Math.max(0,cx),y:bot}}
  return best;
}
function endCardDrag(cancel){
  if(!cdrag)return;
  var d=cdrag;cdrag=null;
  document.querySelectorAll('.dragging').forEach(function(a){a.classList.remove('dragging')});
  document.querySelectorAll('.snapto').forEach(function(a){a.classList.remove('snapto')});
  if(cancel||!d.cur){prefs.free.cards=JSON.parse(d.snap0);savePrefs();layoutFree();return}
  if(d.hdr){foldDragged=true;setTimeout(function(){foldDragged=false},80)}
  var F=prefs.free.cards,H=JSON.parse(d.snapH),sn=d.cur,lc=F[d.lead];
  var px=sn.x,py=sn.y,att=sn.att,ins=[];
  function place(x,y){
    var dx=x-d.x0,dy=y-d.y0;
    d.roots.forEach(function(m){F[m].x=Math.round(d.start[m].x+dx);F[m].y=Math.round(d.start[m].y+dy)});
  }
  place(px,py);
  var endRelX=d.R[d.end].x-d.R[d.lead].x;
  if(att){
    var T=att.to;
    if(att.side==='t'){
      var ta=F[T]&&F[T].att;
      if(ta&&ta.side==='b'&&!d.G[ta.to]){ins.push(T);att={to:ta.to,side:'b',off:ta.off}}
    }else if(att.side==='b'){
      Object.keys(F).forEach(function(j){if(!d.G[j]&&F[j].att&&F[j].att.to===T&&F[j].att.side==='b')ins.push(j)});
    }
    lc.att=att;
    ins.forEach(function(j){F[j].att={to:d.end,side:'b',off:Math.round(d.others[j].x-(px+endRelX))}});
  }
  var R2=layoutFree(null,true);
  if(R2&&groupHits(d,R2)){
    // 겹치면 붙이기를 취소하고 가장 가까운 빈자리로
    ins.forEach(function(j){if(H[j]&&H[j].att)F[j].att=H[j].att;else delete F[j].att});
    delete lc.att;att=null;
    R2=layoutFree(null,true);
    var fs=freeSpot(d,R2,px,py);
    place(fs.x,fs.y);px=fs.x;py=fs.y;
  }
  if(att&&(att.side==='b'||att.side==='t')&&d.others[att.to]){
    // 붙은 카드는 폭을 맞춘다
    var tw=d.others[att.to].w,sub={},ch=true;sub[d.lead]=true;
    while(ch){ch=false;Object.keys(d.G).forEach(function(m){if(!sub[m]&&F[m]&&F[m].att&&sub[F[m].att.to]){sub[m]=true;ch=true}})}
    Object.keys(sub).forEach(function(m){F[m].w=tw});
  }
  normTop();
  // 화면 왼쪽·위로 나간 카드는 전체를 밀어서 0 이상으로
  var R3=layoutFree(null,true),mx=0,my=0;
  Object.keys(R3).forEach(function(j){mx=Math.min(mx,R3[j].x);my=Math.min(my,R3[j].y)});
  if(mx<0||my<0)Object.keys(F).forEach(function(j){if(!F[j].att){F[j].x-=mx;F[j].y-=my}});
  savePrefs();layoutFree();
}
document.addEventListener('pointerup',function(){endCardDrag(false)});
document.addEventListener('pointercancel',function(){endCardDrag(true)});
if(window.ResizeObserver){
  var _ro=new ResizeObserver(function(){if(!cdrag)layoutFree()});
  cardEls().forEach(function(c){_ro.observe(c)});
}

/* 컷 위치 복사 · 붙여넣기, 맞춤 모드 */
function copyCuts(){
  if(!S||S.secs.length<2){toast('복사할 컷 위치가 없어요');return}
  var o={times:S.secs.slice(1).map(function(sg){return sg.s}),dur:dur,from:videoId,at:Date.now()};
  LS.set('looper:v1:cuts',o);renderPull();
  toast('컷 위치 '+o.times.length+'개를 복사했어요');
}
function pasteCuts(){
  var o=LS.get('looper:v1:cuts');
  if(!o||!o.times||!o.times.length){toast('복사해 둔 위치가 없어요');return}
  if(!dur){toast('영상을 먼저 불러오세요');return}
  var ts=o.times.slice().sort(function(a,b){return a-b}),keep=[],last=0,dropped=0;
  ts.forEach(function(t){
    if(t>=last+0.2-1e-9&&t<=dur-0.2+1e-9){keep.push(Math.round(t*100)/100);last=t}else dropped++;
  });
  if(!keep.length){toast('붙여넣을 위치가 이 영상 길이 안에 없어요');return}
  stopMode(true);
  var secs=[{id:1,s:0}],order=[1],id=2;
  keep.forEach(function(t){secs.push({id:id,s:t});order.push(id);id++});
  S.secs=secs;S.nid=id;S.order=order;S.n=0;
  selId=1;lastMark=null;msel.clear();selLine=null;
  commit();
  toast('컷 위치 '+keep.length+'개를 붙여넣었어요'+(dropped?(' ('+dropped+'개는 영상 길이를 벗어나 뺐어요)'):'')+' (실행취소로 되돌릴 수 있어요)');
}
function renderPull(){
  var o=LS.get('looper:v1:cuts');
  $('#cutinfo').textContent=(o&&o.times&&o.times.length)?('복사해 둔 위치 '+o.times.length+'개 · 원본 영상 길이 '+fmt(o.dur||0)):'복사해 둔 위치가 없어요';
  $('#pullmode').classList.toggle('on',pullMode);
  var a=0,n2=0,c=0;
  S.secs.forEach(function(sg,k){if(k===0)return;if(sg.g===1)a++;else if(sg.g===2)n2++;else c++});
  $('#pulldone').disabled=!(pullMode||a||n2);
  $('#pulln').value=prefs.pullN;
  $('#pullinfo').textContent=pullMode?('맞춘 선 '+a+'개 · 새 선 '+n2+'개 · 남은 기존 선 '+c+'개')
    :((a||n2)?('임시 색 선 '+(a+n2)+'개가 있어요. 완료를 누르면 일반 색으로 돌아갑니다'):'');
  $('#pulldone').dataset.tip=($('#pullinfo').textContent||'맞춤 모드를 끝내고 보라색 선을 일반 색으로 바꿉니다.');
  $('#markbtn').textContent=pullMode?'맞춤/컷 (M)':'컷 (M)';
}
$('#cutcopy').addEventListener('click',copyCuts);

$('#pullmode').addEventListener('click',function(){
  pullMode=!pullMode;render();
  toast(pullMode?'맞춤 모드를 켰어요. 컷을 누르면 가까운 선을 맞춰요':'맞춤 모드를 껐어요');
});
$('#pulln').addEventListener('change',function(){
  var v=parseFloat(this.value);
  if(v>0){prefs.pullN=v;savePrefs()}else{this.value=prefs.pullN}

  var n=0;S.secs.forEach(function(sg){if(sg.g){delete sg.g;n++}});

/* 설명 말풍선: 마우스를 올리거나, 폰에서는 꾹 누르면 뜹니다 */
var tipEl=document.createElement('div');tipEl.id='tipbox';tipEl.hidden=true;document.body.appendChild(tipEl);
var tipT=null,tipSup=false;
function showTip(el){
  var t=el.dataset.tip;if(!t)return;
  tipEl.textContent=t;tipEl.hidden=false;
  var r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  var left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
  var top=r.bottom+8;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-8);
  tipEl.style.left=left+'px';tipEl.style.top=top+'px';
}
function hideTip(){tipEl.hidden=true;clearTimeout(tipT)}
document.addEventListener('pointerover',function(e){
  if(e.pointerType==='touch')return;
  var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);
});
document.addEventListener('pointerout',function(e){
  if(e.pointerType==='touch')return;
  var el=e.target.closest&&e.target.closest('[data-tip]');
  if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget)))hideTip();
});
document.addEventListener('pointerdown',function(e){
  hideTip();
  if(e.pointerType!=='touch')return;
  var el=e.target.closest&&e.target.closest('[data-tip]');if(!el)return;
  tipT=setTimeout(function(){showTip(el);tipSup=true;setTimeout(function(){tipSup=false},900);tipT=setTimeout(hideTip,3500)},450);
},true);
['pointerup','pointercancel'].forEach(function(n){document.addEventListener(n,function(e){if(e.pointerType==='touch')clearTimeout(tipT)},true)});
document.addEventListener('scroll',hideTip,true);
document.addEventListener('click',function(e){if(tipSup){e.stopPropagation();e.preventDefault();tipSup=false}},true);
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('[data-tip]')&&('ontouchstart' in window))e.preventDefault()});

/* 작은 영상(PiP): 영상이 화면 밖으로 나가면 작은 창으로 떠 있다. 끌어서 이동, 모서리/두 손가락으로 크기 조절, X로 닫기 */
var pslot=$('#pslot'),pwrapEl=$('#pwrap'),pipOn=false,pipDismissed=false,pipPtr={},pipG=null,pipT0=0,pipMoved=false;
function pipH(w){return Math.round(w*9/16)}
function applyPip(){
  var P=prefs.pip;if(!P)return;
  P.w=Math.max(120,Math.min(Math.min(innerWidth-16,720),P.w));
  P.x=Math.max(4,Math.min(innerWidth-P.w-4,P.x));
  P.y=Math.max(4,Math.min(innerHeight-pipH(P.w)-4,P.y));
  pwrapEl.style.width=P.w+'px';pwrapEl.style.left=P.x+'px';pwrapEl.style.top=P.y+'px';
}
function setPip(on){
  if(on===pipOn)return;pipOn=on;
  if(on){
    pslot.style.height=pwrapEl.getBoundingClientRect().height+'px';
    if(!prefs.pip){var w=innerWidth<700?Math.round(innerWidth*0.4):200;prefs.pip={w:w,x:innerWidth-w-12,y:innerHeight-pipH(w)-12}}
    pwrapEl.classList.add('pip');applyPip();
  }else{
    pwrapEl.classList.remove('pip');pslot.style.height='';
    pwrapEl.style.width='';pwrapEl.style.left='';pwrapEl.style.top='';
  }
}
if(window.IntersectionObserver){
  new IntersectionObserver(function(es){
    var vis=es[0].intersectionRatio>=0.2;
    if(vis){pipDismissed=false;setPip(false)}
    else if(!pipDismissed)setPip(true);
  },{threshold:[0,0.2]}).observe(pslot);
}
$('#pipx').addEventListener('click',function(e){e.stopPropagation();pipDismissed=true;setPip(false)});
window.addEventListener('resize',function(){if(pipOn)applyPip()});
function pipPts(){return Object.keys(pipPtr).map(function(k){return pipPtr[k]})}
function pipStartG(){
  var pts=pipPts(),P=prefs.pip;
  if(pts.length===1)pipG={m:'drag',px:pts[0].x,py:pts[0].y,x0:P.x,y0:P.y};
  else if(pts.length>=2){
    var d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
    pipG={m:'pinch',d0:d,w0:P.w,cx:P.x+P.w/2,cy:P.y+pipH(P.w)/2};
  }else pipG=null;
}
var pov=$('#pipov');
pov.addEventListener('pointerdown',function(e){
  if(!pipOn||e.button>0)return;
  try{pov.setPointerCapture(e.pointerId)}catch(_){}
  if(!Object.keys(pipPtr).length){pipT0=performance.now();pipMoved=false}
  pipPtr[e.pointerId]={x:e.clientX,y:e.clientY};
  pipStartG();e.preventDefault();
});
pov.addEventListener('pointermove',function(e){
  if(!pipG||!pipPtr[e.pointerId])return;
  pipPtr[e.pointerId]={x:e.clientX,y:e.clientY};
  var P=prefs.pip,pts=pipPts();
  if(pipG.m==='drag'){
    var dx=e.clientX-pipG.px,dy=e.clientY-pipG.py;
    if(Math.abs(dx)+Math.abs(dy)>6)pipMoved=true;
    P.x=pipG.x0+dx;P.y=pipG.y0+dy;
  }else if(pts.length>=2){
    pipMoved=true;
    var d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
    P.w=pipG.w0*d/pipG.d0;P.x=pipG.cx-P.w/2;P.y=pipG.cy-pipH(P.w)/2;
  }
  applyPip();
});
function pipEnd(e,cancel){
  if(!pipPtr[e.pointerId])return;
  delete pipPtr[e.pointerId];
  var left=Object.keys(pipPtr).length;
  if(left>0){pipStartG();return}
  pipG=null;savePrefs();
  if(!cancel&&!pipMoved&&performance.now()-pipT0<400)$('#pp').click();
}
pov.addEventListener('pointerup',function(e){pipEnd(e,false)});
pov.addEventListener('pointercancel',function(e){pipEnd(e,true)});
pov.addEventListener('wheel',function(e){
  if(!pipOn)return;e.preventDefault();
  var P=prefs.pip,cx=P.x+P.w/2,cy=P.y+pipH(P.w)/2;
  P.w=P.w*(e.deltaY<0?1.08:0.93);P.x=cx-P.w/2;P.y=cy-pipH(P.w)/2;
  applyPip();savePrefs();
},{passive:false});
var rz=null;
$('#piprz').addEventListener('pointerdown',function(e){
  if(!pipOn||e.button>0)return;
  var P=prefs.pip;rz={sx:e.clientX,sy:e.clientY,w0:P.w,x0:P.x,y0:P.y,pid:e.pointerId};
  try{this.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();e.stopPropagation();
});
$('#piprz').addEventListener('pointermove',function(e){
  if(!rz||e.pointerId!==rz.pid)return;
  var P=prefs.pip,dw=((rz.sx-e.clientX)+(e.clientY-rz.sy)*16/9)/2;
  P.w=rz.w0+dw;P.x=rz.x0+rz.w0-P.w;P.y=rz.y0;
  applyPip();
});
function rzEnd(){if(rz){rz=null;savePrefs()}}
$('#piprz').addEventListener('pointerup',rzEnd);
$('#piprz').addEventListener('pointercancel',rzEnd);

/* CSV 내보내기 / 전체 백업 */
function download(name,text,type){
  try{
    var bl=new Blob([text],{type:type}),a=document.createElement('a');
    a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);return true;
  }catch(e){return false}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
  var rows=[['표시번호','원래번호','커스텀번호','이름','시작(초)','끝(초)','길이(초)','색','메모','구분']];
  var ids=prefs.sort==='custom'?S.order.concat(S.secs.filter(function(g){return g.h}).map(function(g){return g.id})):S.secs.map(function(g){return g.id});
  var r=rEnd();
  ids.forEach(function(id){
    var sg=S.secs[ix(id)],a=sg.s,b=en(id),pi=S.order.indexOf(id);
    var kind=sg.h?'숨김':(pi+1>r?'제외':'학습');
    rows.push([sg.no||'',sg.h?'':onum(id),pi>=0?pi+1:'',sg.nm||'',a.toFixed(2),b.toFixed(2),(b-a).toFixed(2),CNAMES[sg.c||0],sg.m||'',kind]);
  });
  return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function dstamp(){var d=new Date(),z=function(n){return (n<10?'0':'')+n};return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())}
