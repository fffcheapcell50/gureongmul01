  fr.readAsText(f);
});
function H(x){return JSON.stringify({s:x.secs,o:x.order,n:x.n,nx:x.nx||0,sm:x.sm||0,sc:x.sc||0})}
function mergeBackup(o,base){
  var bms=LS.get('looper:v1:bookmarks')||[],have={};bms.forEach(function(b){have[b.id]=1});
  var res={added:0,kept:0,took:0,bmAdd:0,curChanged:false},rid=0;
  /* 지운 북마크 기록을 합치고, 지워진 북마크는 이 기기에서도 뺀다(잠근 것은 남김) */
  var tomb=LS.get('looper:v1:bmdel')||{},tchg=false;
  Object.keys(o.bmdel||{}).forEach(function(id){if(!tomb[id]){tomb[id]=o.bmdel[id];tchg=true}});
  var keepBms=bms.filter(function(b){return !tomb[b.id]||b.lock});
  if(keepBms.length!==bms.length){bms=keepBms;have={};bms.forEach(function(b){have[b.id]=1});res.bmAdd++}
  function addBm(vid,name,state){
    /* 자동으로 남기는 북마크는 같은 영상에서 최신 하나만 둔다 (잠근 것은 그대로) */
    bms=bms.filter(function(b){if(b.auto&&b.videoId===vid&&!b.lock){tomb[b.id]=Date.now();tchg=true;return false}return true});
    var nid='b'+Date.now().toString(36)+(rid++);
    bms.unshift({id:nid,name:name,videoId:vid,savedAt:Date.now(),auto:true,state:JSON.parse(JSON.stringify(state))});have[nid]=1;res.bmAdd++}
  var dt=new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
  Object.keys(o.states||{}).forEach(function(vid){
    var inc=o.states[vid];if(!validState(inc))return;
    var loc=LS.get('looper:v1:state:'+vid),hasLoc=validState(loc)&&loc.secs.length>1;
    var ih=H(inc),same=validState(loc)&&H(loc)===ih;
    /* 같은 내용이면 아무것도 하지 않는다 (화면을 다시 불러오지도 않는다) */
    function take(){if(same)return;LS.set('looper:v1:state:'+vid,inc);if(vid===videoId)res.curChanged=true}
    if(!hasLoc){take();res.added++;return}
    var lh=H(loc);if(ih===lh)return;
    /* 편집한 적 없는 빈 상태(구간 1개)는 실제 편집을 절대 덮어쓰지 못한다. 클라우드에도 이 기기 것이 올라가 바로잡힌다 */
    if(inc.secs.length<=1){res.kept++;return}
    if(base&&base[vid]!==undefined){
      if(lh===base[vid]){take();res.took++;return}
      if(ih===base[vid]){res.kept++;return}
    }
    if((inc.mt||0)>(loc.mt||0)){addBm(vid,'이전 편집 '+dt,loc);take();res.took++}
    else{addBm(vid,'가져온 편집 '+dt,inc);res.kept++}
  });
  (o.bookmarks||[]).forEach(function(b){
    if(!b||!b.id||!b.videoId||!validState(b.state))return;
    if(tomb[b.id])return;
    if(!have[b.id]){bms.push(b);have[b.id]=1;res.bmAdd++;return}
    var lb=bms.filter(function(x){return x.id===b.id})[0];
    if(lb&&(b.la||0)>(lb.la||0)){lb.lock=!!b.lock;lb.la=b.la;res.bmAdd++}
  });
  var tk=Object.keys(tomb);
  if(tk.length>500){tk.sort(function(a,b){return tomb[b]-tomb[a]}).slice(500).forEach(function(k){delete tomb[k]});tchg=true}
  if(tchg)LS.set('looper:v1:bmdel',tomb);
  LS.set('looper:v1:bookmarks',bms);
  var r=getRecent(),seen={};r.forEach(function(x){seen[x.id]=1});
  (o.recent||[]).forEach(function(x){if(x&&x.id&&!seen[x.id]){r.push(x);seen[x.id]=1}});
  r.sort(function(a,b){return (b.at||0)-(a.at||0)});LS.set('looper:v1:recent',r.slice(0,20));
  return res;
}
function reloadCurrent(){
  /* 영상 플레이어는 다시 불러오지 않고 편집 내용만 바꾼다 (깜박이지 않고 재생도 이어진다) */
  if(!videoId)return;
  var sv=LS.get('looper:v1:state:'+videoId);
  if(validState(sv)){
    if(S&&H(S)===H(sv))return;
    stopMode(true);S=sv;S.flip=!!S.flip;selId=S.order[0];resetHistory();render();
  }else render();
}
function importBackup(o){
  if(!o||o.app!=='gureongmul'||!o.states){toast('이 앱의 백업 파일이 아니에요');return}
  var r=mergeBackup(o,null);
  reloadCurrent();renderBookmarks();
  toast('새로 가져온 영상 '+r.added+'개 · 가져온 쪽이 최근이라 바꾼 영상 '+r.took+'개 · 이 기기 쪽이 최근이라 유지한 영상 '+r.kept+'개 · 북마크 '+r.bmAdd+'개 추가');
}

/* GitHub Gist 동기화 */
var SYNC_FILE='gureongmul-sync.json',SYNC_DESC='gureongmul-sync';
var syncBusy=false,syncQ=false,syncTimer=null,syncErr='',noPush=false,qRuns=[],reloadHits=[],syncHold=0;
function syncCfg(){var c=LS.get('looper:v1:sync');return c&&c.token&&c.gid?c:null}
function gh(path,opt){
  var cfg=LS.get('looper:v1:sync')||{};opt=opt||{};
  opt.headers=Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},opt.headers||{});
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(r.status===401)throw new Error('토큰이 올바르지 않아요');
    if(r.status===403||r.status===404)throw new Error('접근할 수 없어요 (권한 또는 주소 확인)');
    if(!r.ok)throw new Error('GitHub 오류 '+r.status);
    return r.json();
  });
}
function syncUi(){
  var c=syncCfg(),el=$('#syncst'),box=$('#syncmsg');
  var on=!!c&&!c.off;
  el.hidden=!c;
  el.textContent=!c?'':(c.off?'동기화 꺼짐':(syncBusy?'동기화 중…':(syncErr?'동기화 오류':'동기화됨 ✓')));
  el.classList.toggle('err',!!syncErr);
  $('#synctokrow').hidden=!!c;
  $('#syncbtns').hidden=!c;
  $('#syncoff').textContent=(c&&c.off)?'동기화 켜기':'동기화 끄기';
  var when=c&&c.at?new Date(c.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}):'';
  box.textContent=!c?'':(syncErr?('오류: '+syncErr):(when?('마지막 동기화 '+when):''));
}
function baseOf(bk){
  var b={};Object.keys(bk.states||{}).forEach(function(vid){if(validState(bk.states[vid]))b[vid]=H(bk.states[vid])});
  return b;
}
function syncNow(force){
  var cfg=syncCfg();if(!cfg||cfg.off)return Promise.resolve();
  if(force===true)syncHold=0;else if(Date.now()<syncHold)return Promise.resolve();
  if(syncBusy){syncQ=true;return Promise.resolve()}
  syncBusy=true;syncErr='';syncUi();
  var remoteTxt='',hadFile=false;
  return gh('/gists/'+cfg.gid).then(function(g){
    var f=g.files&&g.files[SYNC_FILE];hadFile=!!f;
    if(!f)return '';
    return f.truncated?fetch(f.raw_url).then(function(r){return r.text()}):f.content;
  }).then(function(txt){
    remoteTxt=txt||'';
    var o=null;try{o=JSON.parse(remoteTxt)}catch(e){}
    noPush=true;var res=null;try{res=(o&&o.app==='gureongmul')?mergeBackup(o,cfg.base||{}):null}finally{noPush=false}
    var local=buildBackup();
    var fp=function(x){return JSON.stringify({s:x.states,b:x.bookmarks,r:x.recent,d:x.bmdel||{}})};
    var same=false;try{same=o&&fp(o)===fp(local)}catch(e){}
    var done=function(){
      /* 기준은 "방금 클라우드에 올라간 내용"이어야 한다. 요청 중에 더 편집한 것은 아직 안 올라갔으므로 기준에 넣지 않는다 */
      var c2=LS.get('looper:v1:sync')||cfg;c2.base=baseOf(local);c2.at=Date.now();LS.set('looper:v1:sync',c2);
      if(res&&res.curChanged){
        var tn=Date.now();reloadHits=reloadHits.filter(function(t){return tn-t<60000});reloadHits.push(tn);
        if(reloadHits.length>=4){syncHold=tn+300000;reloadHits=[];toast('동기화로 편집이 계속 바뀌어서 5분 쉴게요. 필요하면 "지금 동기화"를 누르세요')}
        noPush=true;try{reloadCurrent()}finally{noPush=false}
      }
      if(res&&res.bmAdd)renderBookmarks();
    };
    if(same&&hadFile){done();return}
    var files={};files[SYNC_FILE]={content:JSON.stringify(local)};
    return gh('/gists/'+cfg.gid,{method:'PATCH',body:JSON.stringify({files:files})}).then(done);
  }).catch(function(e){syncErr=e&&e.message||'알 수 없는 오류'}).then(function(){
    syncBusy=false;syncUi();
    if(syncQ){
      syncQ=false;
      /* 연속으로 다시 도는 것을 막는다: 최근 30초 안에 4번을 넘으면 잠시 쉰다. 오류일 때도 천천히 */
      var now=Date.now();qRuns=qRuns.filter(function(t){return now-t<30000});qRuns.push(now);
      setTimeout(syncNow,syncErr?15000:(qRuns.length>4?15000:600));
    }
  });
}
function schedulePush(){
  if(!syncCfg()||noPush)return;
  if(syncBusy){syncQ=true;return}
  clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,4000);
}
(function(){
  var raw=LS.set;
  LS.set=function(k,v){raw(k,v);if(k.indexOf('looper:v1:state:')===0||k==='looper:v1:bookmarks')schedulePush()};
})();
$('#syncconnect').addEventListener('click',function(){
  var tok=$('#synctoken').value.trim();if(!tok){toast('토큰을 붙여넣으세요');return}
  LS.set('looper:v1:sync',{token:tok});
  $('#syncmsg').textContent='연결 중…';
  gh('/gists?per_page=100').then(function(list){
    var f=list.filter(function(g){return g.description===SYNC_DESC&&g.files&&g.files[SYNC_FILE]})[0];
    if(f)return f.id;
    var files={};files[SYNC_FILE]={content:JSON.stringify(buildBackup())};
    return gh('/gists',{method:'POST',body:JSON.stringify({description:SYNC_DESC,public:false,files:files})}).then(function(g){return g.id});
  }).then(function(id){
    LS.set('looper:v1:sync',{token:tok,gid:id,base:{}});$('#synctoken').value='';
    toast('연결됐어요. 동기화를 시작합니다');syncUi();syncNow();
  }).catch(function(e){LS.set('looper:v1:sync',null);syncErr=e.message;$('#syncmsg').textContent='오류: '+e.message;toast('연결하지 못했어요: '+e.message)});
});
$('#syncnow').addEventListener('click',function(){syncNow(true)});
$('#syncoff').addEventListener('click',function(){var c=LS.get('looper:v1:sync');if(!c)return;c.off=!c.off;LS.set('looper:v1:sync',c);syncUi();if(!c.off)syncNow(true)});
$('#syncdel').addEventListener('click',function(){
  if(!confirm('이 기기의 동기화 연결(토큰)을 지울까요? Gist의 데이터는 그대로 남습니다.'))return;
  LS.set('looper:v1:sync',null);syncErr='';syncUi();toast('연결을 해제했어요');
});
$('#syncst').addEventListener('click',function(){syncNow(true)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncNow()});
syncUi();setTimeout(syncNow,1500);

/* 링크 창 + 실행취소 위치 */
var hasQv=false;try{hasQv=!!parseId(new URLSearchParams(location.search).get('v'))}catch(e){}
var lastId=LS.get('looper:v1:last'),lastSt=lastId&&LS.get('looper:v1:state:'+lastId);
var defaultOnly=!hasQv&&!!lastId&&!getRecent().length&&!(validState(lastSt)&&lastSt.secs.length>1);
var linkOpen=false,needLink=!hasQv&&(!lastId||defaultOnly);
function placeLink(){
  var f=$('#urlform'),r=$('#pslot').getBoundingClientRect(),w=Math.min(560,innerWidth-24);
  f.style.width=w+'px';
  f.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';
  f.style.top=Math.max(12,r.top+12)+'px';
}
function openLink(){linkOpen=true;$('#urlform').hidden=false;renderRecent();placeLink();$('#linkbtn').classList.add('on')}
function closeLink(){linkOpen=false;needLink=false;$('#urlform').hidden=true;$('#linkbtn').classList.remove('on')}
$('#linkbtn').addEventListener('click',function(){linkOpen?closeLink():openLink()});
document.addEventListener('pointerdown',function(e){
  if(!linkOpen||needLink)return;
  if(e.target.closest('#urlform,#linkbtn'))return;
  closeLink();
},true);
function placeUndo(){
  var r=document.querySelector('.stage').getBoundingClientRect(),cw=document.documentElement.clientWidth;
  document.querySelector('.undofix').style.right=Math.max(12,cw-r.right)+'px';
  if(linkOpen)placeLink();
}
addEventListener('resize',placeUndo);addEventListener('scroll',function(){if(linkOpen)placeLink()},{passive:true});
if(window.ResizeObserver)new ResizeObserver(placeUndo).observe(document.querySelector('.grid'));
placeUndo();
if(needLink)openLink();

/* 시작 */
var qv=null;try{qv=parseId(new URLSearchParams(location.search).get('v'))}catch(e){}
var first=qv||(defaultOnly?null:lastId)||null;
S=newState();
if(!first){$('#msg').textContent='위의 "링크" 버튼에 유튜브 링크를 붙여넣고 불러오세요.';render()}else
loadVideo(first,'https://youtu.be/xLVwtJ7C3QQ?rate=0.4'.indexOf(first)>=0&&!LS.get('looper:v1:state:'+first)?'https://youtu.be/xLVwtJ7C3QQ?rate=0.4':'',!qv&&!LS.get('looper:v1:last'));
})();
</script>
